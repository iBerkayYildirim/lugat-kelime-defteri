<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lügat: İngilizce kelimelerini kaydet, kartlarla ve testlerle çalış. Veriler tarayıcında (LocalStorage) saklanır." />
    <title>Lügat · Kişisel Kelime Defteri</title>
    <script>
      // Tema, React yüklenmeden uygulanır; böylece sayfa açılırken renk sıçraması olmaz.
      try {
        var saved = JSON.parse(localStorage.getItem('lugat:theme'))
        document.documentElement.dataset.theme =
          saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'lugat-dark' : 'lugat')
      } catch (e) {
        document.documentElement.dataset.theme = 'lugat'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
